name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      PUBLIC_SUPABASE_URL: ${{ vars.EVENTFLOW_SUPABASE_URL }}
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EVENTFLOW_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install --upgrade pip
          .\.venv\Scripts\python -m pip install -e .[dev]
          if (-not $env:PUBLIC_SUPABASE_URL -or -not $env:PUBLIC_SUPABASE_PUBLISHABLE_KEY) { throw 'Set EVENTFLOW_SUPABASE_URL and EVENTFLOW_SUPABASE_PUBLISHABLE_KEY repository variables before releasing.' }
          @("PUBLIC_SUPABASE_URL=$env:PUBLIC_SUPABASE_URL", "PUBLIC_SUPABASE_PUBLISHABLE_KEY=$env:PUBLIC_SUPABASE_PUBLISHABLE_KEY") | Set-Content -Encoding utf8 .env
      - name: Test
        shell: pwsh
        run: .\.venv\Scripts\python -m pytest -q tests/teams_v2
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer and update package
        shell: pwsh
        run: |
          .\build_installer.ps1
          Compress-Archive -Path .\release\EventFlowTeams\* -DestinationPath .\release\EventFlowTeams-Windows.zip -Force
          Get-FileHash .\release\installer\*.exe, .\release\EventFlowTeams-Windows.zip -Algorithm SHA256 | Format-Table -AutoSize | Out-String | Set-Content -Encoding utf8 .\release\SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/installer/*.exe
            release/EventFlowTeams-Windows.zip
            release/SHA256SUMS.txt
