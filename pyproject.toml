[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eventflow-teams-v2"
version = "0.3.62"
description = "EventFlow Teams V2 — Local workflow with company synchronization"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7",
  "openpyxl>=3.1,<4",
  "numpy>=2,<3",
  "requests>=2.32,<3",
  "keyring>=25,<26",
  "websocket-client>=1.8,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pyinstaller>=6,<7"]

[project.scripts]
event-flow = "event_checklist.app:main"
eventflow-teams-v2 = "eventflow_teams_v2.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
event_checklist = ["resources/*.json", "resources/assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/local", "tests/teams_v2"]
